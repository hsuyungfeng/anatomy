<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>眼睛結構位置校正工具 - Eye Structure Calibration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .workspace {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      margin-bottom: 20px;
    }
    .canvas-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    canvas {
      display: block;
      border: 2px solid #ddd;
      cursor: crosshair;
      background: white;
      margin-bottom: 10px;
    }
    .info {
      background: #e3f2fd;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #1565c0;
    }
    .sidebar {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      height: fit-content;
    }
    .structure-selector {
      margin-bottom: 15px;
    }
    .structure-selector label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
      font-size: 13px;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      background: white;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #1976d2;
      color: white;
    }
    .btn-primary:hover {
      background: #1565c0;
    }
    .btn-success {
      background: #388e3c;
      color: white;
    }
    .btn-success:hover {
      background: #2e7d32;
    }
    .btn-danger {
      background: #d32f2f;
      color: white;
    }
    .btn-danger:hover {
      background: #c62828;
    }
    .btn-secondary {
      background: #757575;
      color: white;
    }
    .btn-secondary:hover {
      background: #616161;
    }
    .status {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
      font-size: 12px;
      min-height: 40px;
    }
    .calibrated {
      color: #388e3c;
      font-weight: 600;
    }
    .pending {
      color: #f57c00;
      font-weight: 600;
    }
    .log {
      max-height: 200px;
      overflow-y: auto;
      background: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      margin-top: 10px;
      border: 1px solid #eee;
    }
    .log-item {
      padding: 3px 0;
      border-bottom: 1px solid #f0f0f0;
      color: #666;
    }
    .log-item.success {
      color: #388e3c;
    }
    .log-item.error {
      color: #d32f2f;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 0;
      font-size: 12px;
    }
    .stat {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
    }
    .stat-value {
      font-weight: 700;
      font-size: 14px;
      color: #1976d2;
    }
    .stat-label {
      color: #666;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👁️ 眼睛結構位置校正工具</h1>
    <p class="subtitle">Eye Structure Calibration Tool - Click on each eye structure in the image to record its position</p>

    <div class="workspace">
      <div class="canvas-container">
        <canvas id="canvas"></canvas>
        <div class="info">
          💡 <strong>校正步驟：</strong><br>
          1. 從下拉菜單選擇眼睛結構<br>
          2. 點擊「記錄當前結構位置」按鈕<br>
          3. 在圖像上點擊該結構的中心<br>
          <br>
          <strong>圖像標記說明：</strong><br>
          • 綠圈 = 已校正的結構位置<br>
          • 中文名稱 = 結構名稱<br>
          • [順序] = 校正的順序 (例如 [1], [2], ...)<br>
        </div>
      </div>

      <div class="sidebar">
        <div class="structure-selector">
          <label>選擇眼睛結構 (Eye Structure)：</label>
          <select id="structureSelect"></select>
        </div>

        <button class="btn-primary" onclick="captureStructurePosition()">
          📍 記錄當前結構位置
        </button>

        <div class="status" id="status">準備就緒</div>

        <div class="stats">
          <div class="stat">
            <div class="stat-value" id="calibratedCount">0</div>
            <div class="stat-label">已校正</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="totalCount">0</div>
            <div class="stat-label">總計</div>
          </div>
        </div>

        <button class="btn-success" onclick="exportCalibration()" style="margin-top: 15px;">
          💾 匯出座標數據
        </button>

        <button class="btn-danger" onclick="resetCalibration()">
          🔄 重置所有
        </button>

        <button class="btn-secondary" onclick="downloadJSON()">
          ⬇️ 下載 JSON
        </button>

        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <script>
    // DOM 元素參考
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const structureSelect = document.getElementById('structureSelect');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');
    const calibratedCountDiv = document.getElementById('calibratedCount');
    const totalCountDiv = document.getElementById('totalCount');

    // 全域狀態變數
    let image = null;
    let coordinates = null;
    let calibrationData = {};
    let currentStructureId = null;
    let imageLoaded = false;

    /**
     * 添加日誌訊息
     * @param {string} message 訊息內容
     * @param {string} type 訊息類型 ('normal', 'success', 'error')
     */
    function addLog(message, type = 'normal') {
      const item = document.createElement('div');
      item.className = 'log-item ' + type;
      item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(item);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    /**
     * 非同步加載眼睛座標數據
     */
    async function loadCoordinates() {
      try {
        const response = await fetch('/data/eye-coordinates.json');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        coordinates = await response.json();
        addLog('✓ 眼睛座標數據加載成功', 'success');
        updateStructureSelector();
        initializeCalibrationData();
      } catch (error) {
        addLog('✗ 座標數據加載失敗: ' + error.message, 'error');
      }
    }

    /**
     * 加載眼睛圖像
     */
    async function loadImage() {
      try {
        if (!coordinates) {
          addLog('✗ 座標數據未加載，無法加載圖像', 'error');
          return;
        }

        const imageInfo = coordinates.imageReferenceSize;
        const imagePath = `/assets/images/eye/${imageInfo.filename}`;

        image = new Image();
        image.onload = () => {
          imageLoaded = true;
          canvas.width = image.width;
          canvas.height = image.height;
          redraw();
          addLog(`✓ 3D 眼睛圖像加載: (${image.width}x${image.height})`, 'success');
        };
        image.onerror = () => {
          addLog(`✗ 無法加載圖像: ${imagePath}`, 'error');
          imageLoaded = false;
        };
        image.src = imagePath;
      } catch (error) {
        addLog('✗ 圖像加載錯誤: ' + error.message, 'error');
      }
    }

    /**
     * 初始化校正數據結構，為所有結構創建空槽位
     */
    function initializeCalibrationData() {
      if (!coordinates || !coordinates.structures) return;
      calibrationData = {};
      Object.keys(coordinates.structures).forEach(id => {
        calibrationData[id] = null;
      });
    }

    /**
     * 更新結構選擇下拉菜單
     */
    function updateStructureSelector() {
      if (!coordinates || !coordinates.structures) return;
      structureSelect.innerHTML = '';

      Object.entries(coordinates.structures).forEach(([id, structure]) => {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = `${structure.nameCh} (${structure.name})`;
        structureSelect.appendChild(option);
      });

      currentStructureId = structureSelect.value;
    }

    /**
     * 更新統計數據顯示
     */
    function updateStats() {
      const total = Object.keys(calibrationData).length;
      const calibrated = Object.values(calibrationData).filter(v => v !== null).length;
      calibratedCountDiv.textContent = calibrated;
      totalCountDiv.textContent = total;
    }

    /**
     * 重新繪製 Canvas，包括圖像和已校正位置
     */
    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 繪製背景圖像
      if (imageLoaded && image) {
        ctx.drawImage(image, 0, 0);
      }

      // 繪製已校正的結構位置
      Object.entries(calibrationData).forEach(([id, data], index) => {
        if (data && coordinates.structures[id]) {
          const structure = coordinates.structures[id];

          // 繪製綠色圓圈
          ctx.fillStyle = 'rgba(76, 175, 80, 0.2)';
          ctx.strokeStyle = '#4CAF50';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(data.x, data.y, 25, 0, 2 * Math.PI);
          ctx.fill();
          ctx.stroke();

          // 繪製結構名稱標籤
          ctx.fillStyle = '#333';
          ctx.font = 'bold 11px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(structure.nameCh, data.x, data.y - 50);

          // 繪製校正順序編號
          ctx.fillStyle = '#f57c00';
          ctx.font = 'bold 9px Arial';
          const calibratedList = Object.values(calibrationData).filter(v => v !== null);
          const orderNum = calibratedList.findIndex(v => v === data) + 1;
          ctx.fillText(`[${orderNum}]`, data.x, data.y + 55);
        }
      });

      // 高亮顯示目前選擇的結構（如果已定義）
      if (currentStructureId && calibrationData[currentStructureId]) {
        const data = calibrationData[currentStructureId];
        ctx.fillStyle = 'rgba(33, 150, 243, 0.3)';
        ctx.strokeStyle = '#2196F3';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(data.x, data.y, 25, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
      }
    }

    /**
     * 記錄當前選擇結構的位置
     * 提示使用者點擊圖像，並記錄點擊座標
     */
    function captureStructurePosition() {
      if (!currentStructureId) {
        statusDiv.innerHTML = '<span class="error">請選擇眼睛結構</span>';
        return;
      }

      const structure = coordinates.structures[currentStructureId];
      statusDiv.innerHTML = '<span class="pending">點擊圖像上的 ' + structure.nameCh + ' 位置...</span>';
      canvas.style.cursor = 'crosshair';

      /**
       * Canvas 點擊事件處理
       */
      const handleClick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // 記錄座標
        calibrationData[currentStructureId] = { x, y, radius: 50 };

        addLog(`✓ ${structure.nameCh} 已校正: (${Math.round(x)}, ${Math.round(y)})`, 'success');
        statusDiv.innerHTML = `<span class="calibrated">✓ ${structure.nameCh} 已校正</span>`;

        updateStats();
        redraw();

        // 移除點擊監聽器
        canvas.removeEventListener('click', handleClick);

        // 自動移動到下一個結構
        const currentIndex = Array.from(structureSelect.options).findIndex(o => o.value === currentStructureId);
        if (currentIndex < structureSelect.options.length - 1) {
          structureSelect.selectedIndex = currentIndex + 1;
          currentStructureId = structureSelect.value;
          setTimeout(() => captureStructurePosition(), 500);
        } else {
          statusDiv.innerHTML = '<span class="calibrated">✓ 所有眼睛結構已校正</span>';
          canvas.style.cursor = 'default';
        }
      };

      canvas.addEventListener('click', handleClick);
    }

    /**
     * 匯出校正後的座標數據
     * 更新 coordinates 物件並在控制台打印
     */
    function exportCalibration() {
      const structures = coordinates.structures;

      // 更新校正後的座標
      Object.keys(structures).forEach(id => {
        if (calibrationData[id]) {
          structures[id].x = Math.round(calibrationData[id].x);
          structures[id].y = Math.round(calibrationData[id].y);
          structures[id].radius = calibrationData[id].radius;
        }
      });

      // 生成輸出物件
      const output = {
        version: coordinates.version,
        description: coordinates.description,
        lastUpdated: new Date().toISOString().split('T')[0],
        imageReferenceSize: coordinates.imageReferenceSize,
        structures: structures
      };

      console.log('更新的眼睛座標數據：');
      console.log(JSON.stringify(output, null, 2));
      addLog('✓ 座標數據已準備匯出', 'success');
      alert('座標數據已在控制台打印。複製並保存到 eye-coordinates.json');
    }

    /**
     * 下載校正後的座標數據為 JSON 檔案
     */
    function downloadJSON() {
      exportCalibration();

      const structures = coordinates.structures;

      // 更新座標
      Object.keys(structures).forEach(id => {
        if (calibrationData[id]) {
          structures[id].x = Math.round(calibrationData[id].x);
          structures[id].y = Math.round(calibrationData[id].y);
          structures[id].radius = calibrationData[id].radius;
        }
      });

      // 生成 JSON 物件
      const output = {
        version: coordinates.version,
        description: coordinates.description,
        lastUpdated: new Date().toISOString().split('T')[0],
        imageReferenceSize: coordinates.imageReferenceSize,
        structures: structures
      };

      // 下載 JSON 檔案
      const dataStr = JSON.stringify(output, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'eye-coordinates.json';
      link.click();
      addLog('✓ eye-coordinates.json 已下載', 'success');
    }

    /**
     * 重置所有校正數據
     */
    function resetCalibration() {
      if (confirm('確定要重置所有眼睛結構的校正資料嗎?')) {
        initializeCalibrationData();
        updateStats();
        redraw();
        statusDiv.innerHTML = '已重置';
        addLog('🔄 所有校正資料已重置', 'normal');
      }
    }

    /**
     * 事件監聽器 - 結構選擇更改
     */
    structureSelect.addEventListener('change', (e) => {
      currentStructureId = e.target.value;
      redraw();
    });

    /**
     * 頁面加載完成時的初始化
     */
    window.addEventListener('load', async () => {
      await loadCoordinates();
      await loadImage();
      updateStats();
      addLog('👁️ 眼睛結構校正工具已就緒', 'success');
    });
  </script>
</body>
</html>
