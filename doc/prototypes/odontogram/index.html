<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牙位圖原型</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1d2330;
      --muted: #5d6677;
      --border: #d9dee7;
      --crown: #fbfaf5;
      --crown-stroke: #8a8f99;
      --root: #efe6d2;
      --root-stroke: #a39578;
      --hover: #dbe9ff;
      --accent: #2563eb;
      --caries: #dc4a3d;
      --root-canal: #8b5cf6;
      --guide: #c9ced8;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12151b;
        --surface: #1b2029;
        --text: #e6e9ef;
        --muted: #9aa3b2;
        --border: #2d3441;
        --crown: #e9e6dc;
        --crown-stroke: #6f7580;
        --root: #b9ab8c;
        --root-stroke: #8c7e62;
        --hover: #29406b;
        --accent: #6ea0ff;
        --caries: #f06b5f;
        --root-canal: #a98bfa;
        --guide: #3a4150;
      }
    }
    :root[data-theme="dark"] {
      --bg: #12151b; --surface: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --border: #2d3441;
      --crown: #e9e6dc; --crown-stroke: #6f7580; --root: #b9ab8c; --root-stroke: #8c7e62;
      --hover: #29406b; --accent: #6ea0ff; --caries: #f06b5f; --root-canal: #a98bfa; --guide: #3a4150;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 20px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button {
      border: 0; background: var(--surface); color: var(--text);
      padding: 8px 14px; font: inherit; cursor: pointer;
    }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .chart-card { overflow-x: auto; }
    .odontogram { width: 100%; min-width: 560px; height: auto; display: block; }

    .guide { stroke: var(--guide); stroke-width: 1; stroke-dasharray: 4 4; }
    .guide--mid { stroke-dasharray: none; }
    .quadrant-label { fill: var(--muted); font-size: 14px; }
    .tooth-label { fill: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; pointer-events: none; }

    .tooth { cursor: pointer; outline: none; }
    .tooth .hit { fill: transparent; }
    .tooth .crown { fill: var(--crown); stroke: var(--crown-stroke); stroke-width: 1.4; transition: fill .12s; }
    .tooth .root { fill: var(--root); stroke: var(--root-stroke); stroke-width: 1.2; transition: fill .12s; }
    .tooth .missing-mark { stroke: var(--caries); stroke-width: 3; stroke-linecap: round; fill: none; display: none; }
    .tooth:hover .crown, .tooth:hover .root { fill: var(--hover); }
    .tooth:focus-visible .crown, .tooth:focus-visible .root { stroke: var(--accent); stroke-width: 2.5; }
    .tooth.is-selected .crown, .tooth.is-selected .root { stroke: var(--accent); stroke-width: 3; }
    .tooth.is-selected .tooth-label { fill: var(--accent); font-weight: 700; }
    .tooth.has-caries .crown { fill: var(--caries); }
    .tooth.has-root-canal .root { fill: var(--root-canal); }
    .tooth.is-missing .crown, .tooth.is-missing .root { opacity: .25; stroke-dasharray: 3 3; }
    .tooth.is-missing .missing-mark { display: inline; }

    .caption { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; padding: 4px 8px 0; }

    .info h2 { font-size: 1rem; margin: 0 0 8px; }
    .info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; }
    .info dt { color: var(--muted); }
    .info dd { margin: 0; font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); }
    .conditions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .conditions button {
      display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
      font: inherit; padding: 8px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .conditions button:disabled { opacity: .45; cursor: not-allowed; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
    .note { color: var(--muted); font-size: .85rem; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>牙位圖原型（結構化 SVG）</h1>
    <p class="lead">每顆牙都是獨立元素：點擊直接取得 FDI 牙位，不需要座標換算。可以用滑鼠，或用 Tab 移動、Enter 選取。</p>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="齒列">
        <button type="button" data-dentition="permanent" aria-pressed="true">永久牙（32）</button>
        <button type="button" data-dentition="primary" aria-pressed="false">乳牙（20）</button>
      </div>
    </div>

    <div class="layout">
      <section class="card chart-card">
        <div id="chart"></div>
        <div class="caption"><span>← 患者右側</span><span>患者左側 →</span></div>
      </section>

      <aside class="card info" aria-live="polite">
        <h2>選取的牙齒</h2>
        <div id="info"><p class="empty">點擊任一顆牙齒</p></div>
        <h2>模擬標記（示範結構著色）</h2>
        <div class="conditions">
          <button type="button" data-condition="caries" disabled><span class="swatch" style="background:var(--caries)"></span>齲齒</button>
          <button type="button" data-condition="root-canal" disabled><span class="swatch" style="background:var(--root-canal)"></span>根管治療</button>
          <button type="button" data-condition="missing" disabled>缺牙</button>
          <button type="button" data-condition="" disabled>清除</button>
        </div>
        <p class="note">正式整合後，這裡會改成開啟既有的疾病記錄表單，病歷儲存的是牙位 ID（FDI），不再是像素座標。</p>
      </aside>
    </div>
  </main>

  <script src="odontogram.js"></script>
  <script>
    (function () {
      const chartEl = document.getElementById('chart');
      const infoEl = document.getElementById('info');
      const condButtons = document.querySelectorAll('.conditions button');
      const conditions = {};
      let chart = null;
      let current = null;

      function showInfo(t) {
        current = t;
        infoEl.innerHTML = '';
        const dl = document.createElement('dl');
        [['名稱', t.nameZh], ['FDI', t.fdi], ['Universal', t.universal],
         ['牙型', t.typeName], ['象限', t.quadrant], ['齒列', t.primary ? '乳牙' : '永久牙']]
          .forEach(([k, v]) => {
            const dt = document.createElement('dt'); dt.textContent = k;
            const dd = document.createElement('dd'); dd.textContent = v;
            dl.append(dt, dd);
          });
        infoEl.appendChild(dl);
        condButtons.forEach(b => { b.disabled = false; });
      }

      function draw(dentition) {
        current = null;
        infoEl.innerHTML = '<p class="empty">點擊任一顆牙齒</p>';
        condButtons.forEach(b => { b.disabled = true; });
        chart = Odontogram.render(chartEl, { dentition, onSelect: showInfo });
        Object.entries(conditions).forEach(([fdi, c]) => chart.setCondition(Number(fdi), c));
      }

      document.querySelectorAll('[data-dentition]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-dentition]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
          draw(btn.dataset.dentition);
        });
      });

      condButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          if (!current) return;
          const c = btn.dataset.condition || null;
          if (c) conditions[current.fdi] = c; else delete conditions[current.fdi];
          chart.setCondition(current.fdi, c);
        });
      });

      draw('permanent');
      window.__odontogram = () => chart;
    })();
  </script>
</body>
</html>
