<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>座標數據可視化工具</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    canvas { border: 2px solid #333; background: white; margin: 20px 0; }
    .info { background: white; padding: 15px; border-radius: 4px; margin: 10px 0; }
    .log { background: #f9f9f9; padding: 10px; margin: 5px 0; border-left: 3px solid #3498db; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🦷 座標數據可視化</h1>
    <p>該工具會加載座標數據並在 canvas 上繪製所有牙齒的檢測區域</p>

    <div class="info">
      <h3>使用說明</h3>
      <ul>
        <li>藍色圓圈：永久牙檢測區域</li>
        <li>紅色圓圈：乳牙檢測區域</li>
        <li>滑鼠懸停：顯示牙齒信息</li>
      </ul>
    </div>

    <canvas id="visualCanvas"></canvas>

    <div id="infoBox" class="info" style="display: none;"></div>

    <div class="log" id="debugLog" style="max-height: 300px; overflow-y: auto;"></div>
  </div>

  <script>
    const canvas = document.getElementById('visualCanvas');
    const ctx = canvas.getContext('2d');
    const infoBox = document.getElementById('infoBox');
    const debugLog = document.getElementById('debugLog');

    function log(msg) {
      const div = document.createElement('div');
      div.textContent = msg;
      debugLog.appendChild(div);
      debugLog.scrollTop = debugLog.scrollHeight;
    }

    async function loadAndVisualize() {
      try {
        log('📥 正在加載座標數據...');
        const response = await fetch('/data/dental-coordinates.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        log(`✓ 座標數據加載成功`);

        // 設置 canvas 尺寸
        const refSize = data.imageReferenceSize.permanteeth;
        canvas.width = refSize.width;
        canvas.height = refSize.height;
        log(`✓ Canvas 尺寸: ${canvas.width} × ${canvas.height}`);

        // 繪製背景網格
        ctx.strokeStyle = '#eee';
        ctx.lineWidth = 1;
        for (let i = 0; i <= canvas.width; i += 100) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, canvas.height);
          ctx.stroke();
        }
        for (let i = 0; i <= canvas.height; i += 100) {
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(canvas.width, i);
          ctx.stroke();
        }

        // 繪製永久牙
        const permanentTeeth = data.permanent.teeth;
        let count = 0;
        for (const [id, tooth] of Object.entries(permanentTeeth)) {
          ctx.fillStyle = 'rgba(52, 152, 219, 0.2)';
          ctx.strokeStyle = '#3498db';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(tooth.x, tooth.y, tooth.radius, 0, 2 * Math.PI);
          ctx.fill();
          ctx.stroke();

          // 繪製牙齒編號
          ctx.fillStyle = '#333';
          ctx.font = '12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`${id}`, tooth.x, tooth.y);
          count++;
        }
        log(`✓ 繪製永久牙: ${count} 顆`);

        // 添加滑鼠移動事件
        canvas.addEventListener('mousemove', (e) => {
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          // 檢查是否在任何牙齒範圍內
          let found = null;
          for (const [id, tooth] of Object.entries(permanentTeeth)) {
            const distance = Math.hypot(x - tooth.x, y - tooth.y);
            if (distance <= tooth.radius) {
              found = { id, tooth, distance, type: 'permanent' };
              break;
            }
          }

          if (found) {
            infoBox.style.display = 'block';
            infoBox.innerHTML = `
              <strong>牙齒: ${found.tooth.nameCh}</strong><br>
              FDI: ${found.tooth.fdi}<br>
              座標: (${found.tooth.x}, ${found.tooth.y})<br>
              半徑: ${found.tooth.radius}<br>
              距離: ${found.distance.toFixed(1)} px<br>
              信心度: ${(Math.max(0, 1 - (found.distance / found.tooth.radius)) * 100).toFixed(1)}%
            `;
          } else {
            infoBox.style.display = 'none';
          }
        });

        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          log(`📍 點擊座標 (原始圖像): ${x.toFixed(0)}, ${y.toFixed(0)}`);

          for (const [id, tooth] of Object.entries(permanentTeeth)) {
            const distance = Math.hypot(x - tooth.x, y - tooth.y);
            if (distance <= tooth.radius) {
              log(`✓ 檢測到: ${tooth.nameCh} (FDI: ${tooth.fdi}), 信心度: ${(Math.max(0, 1 - (distance / tooth.radius)) * 100).toFixed(1)}%`);
              return;
            }
          }
          log(`✗ 點擊位置未在任何牙齒區域內`);
        });

        log(`✓ 可視化完成，請在 canvas 上點擊測試`);

      } catch (error) {
        log(`✗ 錯誤: ${error.message}`);
      }
    }

    loadAndVisualize();
  </script>
</body>
</html>
